<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于系统升级维护的通知</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .announcement-box {
            width: 1000px;
            margin: 0 auto;

        }

        .announcement-detail {
            display: flex;
            flex-direction: column;
        }

        .detail-header {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid #eaeef2;
        }

        .detail-title {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            color: #666;
            font-size: 14px;
        }

        .detail-date {
            margin-right: 15px;
        }

        .new-tag {
            background: #ff4757;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .detail-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            line-height: 1.8;
            color: #444;
            background: #fafbfc;
        }

        .detail-content p {
            margin-bottom: 15px;
            text-align: justify;
        }

        .url-text {
            color: #1890ff;
        }
    </style>
</head>

<body>
    <div class="announcement-box">
        <div class="announcement-detail" id="announcement-detail">
            <div class="detail-header">
                <h2 class="detail-title" id="detailTitle">关于系统升级维护的通知</h2>
                <div class="detail-meta">
                    <span class="detail-date" id="detailDate">发布时间：2023-10-28</span>
                    <div class="new-tag" id="newTag">新公告</div>
                </div>
            </div>
            <div class="detail-content" id="detailContent">
                <p>尊敬的各位用户：</p>
                <p>为了提供更优质的服务，我们将于2023年10月30日（周一）凌晨2:00至5:00进行系统升级维护。在此期间，系统将暂停服务，请您提前做好相关安排。</p>
                <p>维护完成后，系统将恢复正常使用。感谢您的理解与支持！</p>
                <p>如有任何疑问，请联系客服热线：400-123-4567。</p>
            </div>
        </div>
    </div>
    <script>
        window.onload = function () {
            document.getElementById('announcement-detail').onclick = function () {
                window.open('https://zxqysz.jxj.jinhua.gov.cn/qyszi/#', '_blank');
            }
        }
    </script>
</body>

</html>
