<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>粒子圣诞树 - 优化星光版</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; cursor: pointer; }
        #hint {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.7); font-family: "Microsoft YaHei", sans-serif;
            letter-spacing: 1px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="hint">点击切换颜色 | 顶部星光同步切换</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, treeGroup;
        let coreParticles, spiralParticles, star;
        let colorIndex = 0;

        const themes = [
            { main: 0xff69b4, sub: 0xffffff }, // 粉色树 + 白色星
            { main: 0x00aaff, sub: 0xffffff }, // 蓝色树 + 白色星
            { main: 0xffd700, sub: 0xffae00 }  // 金色树 + 金色星
        ];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 10); 
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            treeGroup = new THREE.Group();
            scene.add(treeGroup);

            const sprite = createCircleSprite();

            // 1. 创建树的核心（锥体粒子）
            const coreGeom = new THREE.BufferGeometry();
            const corePos = [];
            for (let i = 0; i < 6000; i++) {
                const y = Math.random() * 6; 
                const radius = (6 - y) * 0.35;
                const theta = Math.random() * Math.PI * 2;
                corePos.push(
                    Math.cos(theta) * radius * Math.sqrt(Math.random()), 
                    y - 3, 
                    Math.sin(theta) * radius * Math.sqrt(Math.random())
                );
            }
            coreGeom.setAttribute('position', new THREE.Float32BufferAttribute(corePos, 3));
            const coreMat = new THREE.PointsMaterial({
                size: 0.07, sizeAttenuation: true, map: sprite,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });
            coreParticles = new THREE.Points(coreGeom, coreMat);
            treeGroup.add(coreParticles);

            // 2. 创建环绕螺旋带
            const spiralGeom = new THREE.BufferGeometry();
            const spiralPos = [];
            for (let i = 0; i < 3500; i++) {
                const t = i / 3500;
                const angle = t * Math.PI * 18; 
                const y = t * 6;
                const radius = (6 - y) * 0.42;
                const off = 0.15;
                spiralPos.push(
                    Math.cos(angle) * radius + (Math.random()-0.5)*off,
                    y - 3 + (Math.random()-0.5)*off,
                    Math.sin(angle) * radius + (Math.random()-0.5)*off
                );
            }
            spiralGeom.setAttribute('position', new THREE.Float32BufferAttribute(spiralPos, 3));
            const spiralMat = new THREE.PointsMaterial({
                size: 0.09, map: sprite, transparent: true,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            spiralParticles = new THREE.Points(spiralGeom, spiralMat);
            treeGroup.add(spiralParticles);

            // 3. 顶部的星 - 改为 Sprite 材质使其更有发光感
            const starMat = new THREE.SpriteMaterial({ 
                map: sprite, 
                color: 0xffffff, 
                blending: THREE.AdditiveBlending,
                transparent: true 
            });
            star = new THREE.Sprite(starMat);
            star.scale.set(0.5, 0.5, 1); // 调整星星大小
            star.position.y = 3.3;       // 往上移了一点（原为3.1）
            treeGroup.add(star);

            updateColors();

            window.addEventListener('mousedown', () => {
                colorIndex = (colorIndex + 1) % themes.length;
                updateColors();
            });

            window.addEventListener('resize', onWindowResize);
        }

        function createCircleSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function updateColors() {
            const theme = themes[colorIndex];
            coreParticles.material.color.setHex(theme.main);
            spiralParticles.material.color.setHex(theme.sub);
            // 修改点：星星颜色现在跟随螺旋带颜色同步切换
            star.material.color.setHex(theme.sub);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            treeGroup.rotation.y += 0.015;
            spiralParticles.position.y = Math.sin(time * 2) * 0.05;
            
            // 星星呼吸闪烁效果
            const starScale = 0.5 + Math.sin(time * 4) * 0.1;
            star.scale.set(starScale, starScale, 1);
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
