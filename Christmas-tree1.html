<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>粒子圣诞树 - 丝滑过渡版</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; cursor: pointer; }
        #hint {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.4); font-family: "Microsoft YaHei", sans-serif;
            letter-spacing: 2px; pointer-events: none; font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="hint">点击屏幕：从上至下色彩流动 🎄</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, treeGroup;
        let coreParticles, spiralParticles, star;
        let colorIndex = 0;
        
        // 过渡相关变量
        let isTransitioning = false;
        let transitionStartTime = 0;
        const transitionDuration = 1.5; // 整个扫描动画持续1.5秒

        const themes = [
            { main: new THREE.Color(0xff69b4), sub: new THREE.Color(0xffffff) }, // 粉色
            { main: new THREE.Color(0x00aaff), sub: new THREE.Color(0xffffff) }, // 蓝色
            { main: new THREE.Color(0xffd700), sub: new THREE.Color(0xffae00) }, // 金色
            { main: new THREE.Color(0x7cfc00), sub: new THREE.Color(0xffffff) }  // 绿色
        ];

        // 记录粒子初始状态，用于颜色插值
        let corePrevColor = new THREE.Color(themes[0].main);
        let spiralPrevColor = new THREE.Color(themes[0].sub);

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            treeGroup = new THREE.Group();
            scene.add(treeGroup);

            const sprite = createCircleSprite();

            // 1. 核心锥体
            const coreGeom = new THREE.BufferGeometry();
            const corePos = [];
            const coreColors = [];
            for (let i = 0; i < 6000; i++) {
                const y = Math.random() * 6;
                const radius = (6 - y) * 0.35;
                const theta = Math.random() * Math.PI * 2;
                corePos.push(Math.cos(theta) * radius * Math.sqrt(Math.random()), y - 3, Math.sin(theta) * radius * Math.sqrt(Math.random()));
                // 初始化颜色
                coreColors.push(themes[0].main.r, themes[0].main.g, themes[0].main.b);
            }
            coreGeom.setAttribute('position', new THREE.Float32BufferAttribute(corePos, 3));
            coreGeom.setAttribute('color', new THREE.Float32BufferAttribute(coreColors, 3));
            coreParticles = new THREE.Points(coreGeom, new THREE.PointsMaterial({
                size: 0.07, map: sprite, transparent: true, blending: THREE.AdditiveBlending, vertexColors: true, depthWrite: false
            }));
            treeGroup.add(coreParticles);

            // 2. 螺旋带
            const spiralGeom = new THREE.BufferGeometry();
            const spiralPos = [];
            const spiralColors = [];
            for (let i = 0; i < 3500; i++) {
                const t = i / 3500;
                const angle = t * Math.PI * 18;
                const y = t * 6;
                const radius = (6 - y) * 0.42;
                spiralPos.push(Math.cos(angle) * radius, y - 3, Math.sin(angle) * radius);
                spiralColors.push(themes[0].sub.r, themes[0].sub.g, themes[0].sub.b);
            }
            spiralGeom.setAttribute('position', new THREE.Float32BufferAttribute(spiralPos, 3));
            spiralGeom.setAttribute('color', new THREE.Float32BufferAttribute(spiralColors, 3));
            spiralParticles = new THREE.Points(spiralGeom, new THREE.PointsMaterial({
                size: 0.09, map: sprite, transparent: true, blending: THREE.AdditiveBlending, vertexColors: true, depthWrite: false
            }));
            treeGroup.add(spiralParticles);

            // 3. 顶部星光
            const starMat = new THREE.SpriteMaterial({ map: sprite, color: themes[0].sub, blending: THREE.AdditiveBlending, transparent: true });
            star = new THREE.Sprite(starMat);
            star.scale.set(0.6, 0.6, 1);
            star.position.y = 3.3;
            treeGroup.add(star);

            // 点击事件
            window.addEventListener('mousedown', startTransition);
            window.addEventListener('resize', onWindowResize);
        }

        function startTransition() {
            if (isTransitioning) return; // 防止重复点击造成混乱
            
            // 保存旧颜色作为起始点
            corePrevColor.copy(themes[colorIndex].main);
            spiralPrevColor.copy(themes[colorIndex].sub);
            
            // 更新索引
            colorIndex = (colorIndex + 1) % themes.length;
            
            // 启动过渡
            isTransitioning = true;
            transitionStartTime = Date.now();
            
            // 星星颜色直接过渡
            // star.material.color.set(themes[colorIndex].sub); // 如果想让星星也慢慢变，可以在animate里处理
        }

        function updateParticleColors(particles, prevColor, targetColor, elapsed) {
            const colors = particles.geometry.attributes.color.array;
            const positions = particles.geometry.attributes.position.array;
            let allDone = true;

            for (let i = 0; i < positions.length / 3; i++) {
                const y = positions[i * 3 + 1]; // Y范围大约是 -3 到 3
                
                // 计算该粒子的变色时机 (从上到下扫描)
                // 顶部 y=3 为 0延迟，底部 y=-3 为 最大延迟
                const normalizedY = (3 - y) / 6; // 0 (顶) 到 1 (底)
                const delay = normalizedY * 0.8; // 扫描延迟系数
                
                // 计算当前粒子的插值进度 (0 到 1)
                let localProgress = (elapsed - delay) / 0.5; // 0.5秒完成单个粒子的变色
                localProgress = Math.max(0, Math.min(1, localProgress));

                if (localProgress < 1) allDone = false;

                // 颜色插值 (Lerp)
                colors[i * 3]     = prevColor.r + (targetColor.r - prevColor.r) * localProgress;
                colors[i * 3 + 1] = prevColor.g + (targetColor.g - prevColor.g) * localProgress;
                colors[i * 3 + 2] = prevColor.b + (targetColor.b - prevColor.b) * localProgress;
            }
            particles.geometry.attributes.color.needsUpdate = true;
            return allDone;
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = Date.now();
            const time = now * 0.001;

            if (isTransitioning) {
                const elapsed = (now - transitionStartTime) / 1000;
                
                const coreDone = updateParticleColors(coreParticles, corePrevColor, themes[colorIndex].main, elapsed);
                const spiralDone = updateParticleColors(spiralParticles, spiralPrevColor, themes[colorIndex].sub, elapsed);
                
                // 星星颜色平滑跟随
                star.material.color.lerpColors(spiralPrevColor, themes[colorIndex].sub, Math.min(1, elapsed / 0.5));

                if (coreDone && spiralDone && elapsed > transitionDuration) {
                    isTransitioning = false;
                }
            }

            treeGroup.rotation.y += 0.015;
            spiralParticles.position.y = Math.sin(time * 2) * 0.05;
            
            const starScale = 0.5 + Math.sin(time * 4) * 0.1;
            star.scale.set(starScale, starScale, 1);

            renderer.render(scene, camera);
        }

        function createCircleSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
